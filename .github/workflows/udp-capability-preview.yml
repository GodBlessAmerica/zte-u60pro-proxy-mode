name: Build UDP-capability preview
on:
  push:
    branches:
      - fix/udp-capability-independent-of-mode
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and shell validation
        run: |
          go test ./...
          go vet ./...
          sh -n bin/proxy-mode
          sh -n scripts/traffic.sh
          sh -n install-udp-capability.sh
          sh -n rollback-udp-capability.sh
      - name: Cross-compile arm64
        run: |
          mkdir -p dist/u60proxy-udp-capability-preview/bin dist/u60proxy-udp-capability-preview/scripts
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/u60proxy-udp-capability-preview/bin/u60proxy ./cmd/u60proxy
          cp bin/proxy-mode dist/u60proxy-udp-capability-preview/bin/
          cp scripts/traffic.sh dist/u60proxy-udp-capability-preview/scripts/
          cp install-udp-capability.sh rollback-udp-capability.sh UDP-CAPABILITY.md dist/u60proxy-udp-capability-preview/
          cd dist
          tar -czf u60proxy-udp-capability-preview.tar.gz u60proxy-udp-capability-preview
          sha256sum u60proxy-udp-capability-preview.tar.gz > SHA256SUMS
      - name: Publish preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1.3-udp-capability-preview >/dev/null 2>&1 || gh release create v2.1.3-udp-capability-preview --target "$GITHUB_SHA" --prerelease --title "U60 UDP capability preview" --notes-file UDP-CAPABILITY.md
          gh release upload v2.1.3-udp-capability-preview dist/u60proxy-udp-capability-preview.tar.gz dist/SHA256SUMS --clobber
