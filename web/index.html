<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>U60 Pro Proxy Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">ZTE U60 Pro</p>
        <h1>Proxy Mode</h1>
      </div>
      <span id="stateBadge" class="badge">Unknown</span>
    </header>

    <section class="grid">
      <article class="card"><span>Mode</span><strong id="mode">—</strong></article>
      <article class="card"><span>WAN</span><strong id="wan">rmnet_data0</strong></article>
      <article class="card"><span>LAN</span><strong id="lan">br-lan</strong></article>
      <article class="card"><span>PID</span><strong id="pid">—</strong></article>
    </section>

    <section class="panel">
      <h2>Control</h2>
      <div class="actions">
        <button data-action="start">Start</button>
        <button data-action="stop">Stop</button>
        <button data-action="restart">Restart</button>
        <button id="refresh">Refresh</button>
      </div>
      <p id="message" class="message">Waiting for proxy API.</p>
    </section>

    <section class="panel">
      <h2>Safety</h2>
      <p>This dashboard is designed for the isolated U60 Pro management service. It does not replace the stock ZTE web UI and must not expose write actions without local authentication.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
